name: Deploy to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Required to deploy to GitHub Pages and to obtain the OIDC token for deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel a run if a new one starts for the same target (avoids overlapping deploys).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
